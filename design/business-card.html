<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Boost Bakery - Business Card</title>
    <style>
        /* Base Branding Inspired by the Site */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
        
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --accent-blue: #422fd3;
            --accent-red: #d32f2f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: #222222;
        }

        body {
            background-color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
        }

        .controls {
            margin-bottom: 30px;
            color: white;
            text-align: center;
        }

        .controls button {
            padding: 10px 20px;
            background: var(--accent-red);
            color: white;
            border: none;
            font-family: inherit;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Business Card Sizing (Standard US 3.5" x 2" at 300 DPI scaling for web preview)
           On screen we'll display it at 1050px x 600px, which looks crisp. */
        .card-container {
            width: 1050px;
            height: 600px;
            background-color: var(--bg-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(211, 47, 47, 0.15);
            margin-bottom: 40px;
            color: var(--text-primary);
            box-sizing: border-box;
            /* Motorsport burnt-titanium gradient edge */
            border: 6px solid;
            border-image: linear-gradient(135deg, var(--accent-red), #f5c000, #111111, #111111, #1976d2, #40c4ff) 1;
        }

        /* Diagonal geometric accent for motorsport feel */
        .accent-bar {
            position: absolute;
            top: 0;
            right: 15%;
            width: 8px;
            height: 150%;
            background-color: var(--accent-blue);
            transform: rotate(25deg);
            transform-origin: top right;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.4);
            z-index: 1;
        }

        .accent-bar-2 {
            position: absolute;
            top: 0;
            right: 12%;
            width: 2px;
            height: 150%;
            background-color: var(--text-muted);
            transform: rotate(25deg);
            transform-origin: top right;
            z-index: 1;
            opacity: 0.3;
        }

        /* Card Layout */
        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 2;
        }

        .left-col {
            flex: 1.2;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

.right-col {
    flex: 1;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    text-align: right;
}

.top-right-text {
    position: absolute;
    top: 80px;
    right: 80px;

    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-secondary);
}

        /* Typography */
        h1 {
            font-size: 58px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            line-height: 1.1;
        }

        .logo-text-1 { color: var(--text-primary); }
        .logo-text-2 { color: var(--text-primary); }

        .tagline {
            font-size: 16px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 15px;
            font-weight: 600;
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            /* color: var(--accent-red); */
        }

        .title {
            font-size: 16px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-item {
            font-size: 16px;
            font-family: var(--font-mono, monospace);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            letter-spacing: 1px;
        }

.contact-icon {
    display: flex;
    flex-direction: row;
    gap: 12px;
    align-items: center;
}

        /* Front Card specifics */
        .front-card {
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .front-card .logo-container {
            margin-bottom: 30px;
        }

        .front-card img {
            max-width: 300px;
        }

        /* Print styles */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            .controls {
                display: none;
            }
            .card-container {
                box-shadow: none;
                border: none;
                margin: 0;
                /* Standard 3.5x2 inches for print */
                width: 3.5in;
                height: 2in;
                zoom: 0.32; /* Scale down the 1050x600 layout */
            }
            /* Add print margins/bleed if necessary */
        }

    </style>
</head>
<body>

    <div class="controls">
        <h2>Business Card Previews</h2>
        <p>You can open this HTML file in your browser to view and print your business cards to PDF.</p>
        <button onclick="window.print()">Print / Save to PDF</button>
    </div>

</body>
</html>
